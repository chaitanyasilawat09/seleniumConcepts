<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 500">
  <defs>
    <linearGradient id="testGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff416c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff4b2b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="baseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#11998e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38ef7d;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="3" dy="3" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="750" height="500" fill="#ffffff" stroke="#e0e0e0" stroke-width="2"/>
  
  <!-- Title -->
  <text x="375" y="35" text-anchor="middle" fill="#333" font-size="22" font-weight="bold" font-family="Arial">🏗️ PAGE OBJECT MODEL (POM)</text>
  
  <!-- Test Class Layer -->
  <rect x="50" y="55" width="650" height="100" rx="12" fill="#ffebee" stroke="url(#testGrad)" stroke-width="3"/>
  <text x="375" y="80" text-anchor="middle" fill="#ff416c" font-size="16" font-weight="bold" font-family="Arial">📝 TEST CLASS</text>
  
  <rect x="70" y="90" width="610" height="50" rx="8" fill="#fff5f5"/>
  <text x="375" y="112" text-anchor="middle" fill="#333" font-size="11" font-family="monospace">@Test void testLogin() {</text>
  <text x="375" y="128" text-anchor="middle" fill="#98c379" font-size="11" font-family="monospace">loginPage.login("user", "pass"); dashboardPage.verifyTitle();</text>
  
  <!-- Arrow -->
  <line x1="375" y1="155" x2="375" y2="175" stroke="#667eea" stroke-width="2"/>
  <polygon points="375,185 368,175 382,175" fill="#667eea"/>
  <text x="395" y="175" fill="#666" font-size="10" font-family="Arial">uses</text>
  
  <!-- Page Classes Layer -->
  <rect x="50" y="195" width="650" height="160" rx="12" fill="#ede7f6" stroke="url(#pageGrad)" stroke-width="3"/>
  <text x="375" y="220" text-anchor="middle" fill="#667eea" font-size="16" font-weight="bold" font-family="Arial">📄 PAGE CLASSES</text>
  
  <!-- LoginPage -->
  <rect x="70" y="235" width="190" height="105" rx="8" fill="url(#pageGrad)" filter="url(#shadow)"/>
  <text x="165" y="258" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold" font-family="Arial">LoginPage</text>
  <line x1="80" y1="268" x2="250" y2="268" stroke="#fff" stroke-opacity="0.5"/>
  <text x="90" y="285" fill="#fff" font-size="10" font-family="monospace">- usernameBox</text>
  <text x="90" y="300" fill="#fff" font-size="10" font-family="monospace">- passwordBox</text>
  <text x="90" y="315" fill="#98c379" font-size="10" font-family="monospace">+ login()</text>
  <text x="90" y="330" fill="#98c379" font-size="10" font-family="monospace">+ clickLogin()</text>
  
  <!-- DashboardPage -->
  <rect x="280" y="235" width="190" height="105" rx="8" fill="url(#pageGrad)" filter="url(#shadow)"/>
  <text x="375" y="258" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold" font-family="Arial">DashboardPage</text>
  <line x1="290" y1="268" x2="460" y2="268" stroke="#fff" stroke-opacity="0.5"/>
  <text x="300" y="285" fill="#fff" font-size="10" font-family="monospace">- welcomeMsg</text>
  <text x="300" y="300" fill="#fff" font-size="10" font-family="monospace">- logoutBtn</text>
  <text x="300" y="315" fill="#98c379" font-size="10" font-family="monospace">+ verifyTitle()</text>
  <text x="300" y="330" fill="#98c379" font-size="10" font-family="monospace">+ logout()</text>
  
  <!-- ProfilePage -->
  <rect x="490" y="235" width="190" height="105" rx="8" fill="url(#pageGrad)" filter="url(#shadow)"/>
  <text x="585" y="258" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold" font-family="Arial">ProfilePage</text>
  <line x1="500" y1="268" x2="670" y2="268" stroke="#fff" stroke-opacity="0.5"/>
  <text x="510" y="285" fill="#fff" font-size="10" font-family="monospace">- editBtn</text>
  <text x="510" y="300" fill="#fff" font-size="10" font-family="monospace">- saveBtn</text>
  <text x="510" y="315" fill="#98c379" font-size="10" font-family="monospace">+ updateName()</text>
  <text x="510" y="330" fill="#98c379" font-size="10" font-family="monospace">+ save()</text>
  
  <!-- Arrow -->
  <line x1="375" y1="355" x2="375" y2="375" stroke="#11998e" stroke-width="2"/>
  <polygon points="375,385 368,375 382,375" fill="#11998e"/>
  <text x="395" y="375" fill="#666" font-size="10" font-family="Arial">extends</text>
  
  <!-- Base Page Layer -->
  <rect x="150" y="395" width="450" height="90" rx="12" fill="#e8f5e9" stroke="url(#baseGrad)" stroke-width="3"/>
  <text x="375" y="420" text-anchor="middle" fill="#38ef7d" font-size="16" font-weight="bold" font-family="Arial">🔧 BASE PAGE</text>
  
  <rect x="170" y="435" width="410" height="40" rx="8" fill="#c8e6c9"/>
  <text x="375" y="455" text-anchor="middle" fill="#333" font-size="11" font-family="monospace">Page page; + getTitle() + navigate() + waitForLoad()</text>
  <text x="375" y="470" text-anchor="middle" fill="#98c379" font-size="10" font-family="monospace">Common methods for all pages</text>
</svg>
