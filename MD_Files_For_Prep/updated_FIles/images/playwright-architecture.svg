<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#11998e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38ef7d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ee0979;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6a00;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="3" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="#ffffff" stroke="#e0e0e0" stroke-width="2"/>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#333" font-size="24" font-weight="bold" font-family="Arial">PLAYWRIGHT ARCHITECTURE</text>
  
  <!-- Test Code Box -->
  <rect x="300" y="60" width="200" height="50" rx="10" fill="url(#grad1)" filter="url(#shadow)"/>
  <text x="400" y="92" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold" font-family="Arial">Test Code (Java)</text>
  
  <!-- Arrow 1 -->
  <path d="M400 110 L400 140" stroke="#667eea" stroke-width="3" marker-end="url(#arrowhead)"/>
  <polygon points="400,145 395,135 405,135" fill="#667eea"/>
  
  <!-- Playwright Library Box -->
  <rect x="150" y="150" width="500" height="120" rx="10" fill="#f0fff4" stroke="url(#grad2)" stroke-width="3"/>
  <text x="400" y="180" text-anchor="middle" fill="#38ef7d" font-size="18" font-weight="bold" font-family="Arial">PLAYWRIGHT LIBRARY</text>
  
  <!-- Inner boxes -->
  <rect x="170" y="195" width="100" height="60" rx="8" fill="url(#grad2)" filter="url(#shadow)"/>
  <text x="220" y="230" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold" font-family="Arial">Locators</text>
  
  <rect x="290" y="195" width="100" height="60" rx="8" fill="url(#grad2)" filter="url(#shadow)"/>
  <text x="340" y="230" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold" font-family="Arial">Auto-Wait</text>
  
  <rect x="410" y="195" width="100" height="60" rx="8" fill="url(#grad2)" filter="url(#shadow)"/>
  <text x="460" y="230" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold" font-family="Arial">Actions</text>
  
  <rect x="530" y="195" width="100" height="60" rx="8" fill="url(#grad2)" filter="url(#shadow)"/>
  <text x="580" y="230" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold" font-family="Arial">Network</text>
  
  <!-- Arrow 2 -->
  <path d="M400 270 L400 300" stroke="#11998e" stroke-width="3"/>
  <polygon points="400,310 395,300 405,300" fill="#11998e"/>
  
  <!-- Browser Binaries Box -->
  <rect x="100" y="315" width="600" height="150" rx="10" fill="#fff5f5" stroke="url(#grad3)" stroke-width="3"/>
  <text x="400" y="345" text-anchor="middle" fill="#ff6a00" font-size="18" font-weight="bold" font-family="Arial">BROWSER BINARIES</text>
  
  <!-- Chromium -->
  <rect x="140" y="365" width="150" height="80" rx="10" fill="url(#grad3)" filter="url(#shadow)"/>
  <text x="215" y="400" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold" font-family="Arial">🌐 Chromium</text>
  <text x="215" y="425" text-anchor="middle" fill="#fff" font-size="11" font-family="Arial">(Chrome, Edge)</text>
  
  <!-- Firefox -->
  <rect x="320" y="365" width="150" height="80" rx="10" fill="url(#grad3)" filter="url(#shadow)"/>
  <text x="395" y="400" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold" font-family="Arial">🦊 Firefox</text>
  <text x="395" y="425" text-anchor="middle" fill="#fff" font-size="11" font-family="Arial">(Gecko Engine)</text>
  
  <!-- WebKit -->
  <rect x="500" y="365" width="150" height="80" rx="10" fill="url(#grad3)" filter="url(#shadow)"/>
  <text x="575" y="400" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold" font-family="Arial">🧭 WebKit</text>
  <text x="575" y="425" text-anchor="middle" fill="#fff" font-size="11" font-family="Arial">(Safari)</text>
</svg>
